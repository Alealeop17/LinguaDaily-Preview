   ["I'd like to learn English.",'Мне бы хотелось учить английский.','I’d like — вежливая форма желания.'],
  ],
  tasks:[

   ['Я хочу учить английский, чтобы работать здесь.','I want to learn English to work here.','To work — чтобы работать.'],

};
const KEY='lingua-daily-iphone-preview-v4';
const $=id=>document.getElementById(id);
const fresh=()=>({position:0,mode:'lesson',task:0,typed:'',checked:false,results:[]});
function valid(s,l){return !!s&&typeof s==='object'&&!Array.isArray(s)&&s.mode==='lesson'||false;}
function safe(s,l){const d=DATA[l];return !!s&&typeof s==='object'&&!Array.isArray(s)&&['lesson','practice'].includes(s.mode)&&Number.isInteger(s.position)&&s.position>=0&&s.position<=d.forms.length+d.examples.length&&Number.isInteger(s.task)&&s.task>=0&&s.task<=d.tasks.length&&typeof s.typed==='string'&&s.typed.length<=500&&typeof s.checked==='boolean'&&Array.isArray(s.results)&&s.results.length===s.task&&s.results.every(x=>x&&typeof x.value==='string'&&typeof x.match==='boolean');}
let saved;
try{const v=JSON.parse(localStorage.getItem(KEY)||'null');saved=v&&['es','en'].includes(v.language)&&safe(v.es,'es')&&safe(v.en,'en')?v:null;}catch(e){}
if(!saved)saved={language:'es',es:fresh(),en:fresh()};
let lang=saved.language,playing=false,token=0,delay=null,message='',explanationOpen=false;
const app=$('app');const current=()=>DATA[lang],state=()=>saved[lang];
function persist(){saved.language=lang;try{localStorage.setItem(KEY,JSON.stringify(saved));}catch(e){message='В этом режиме браузер не сохранил прогресс.';}}
function el(tag,cls,content){const x=document.createElement(tag);if(cls)x.className=cls;if(content!==undefined)x.textContent=content;return x;}
function btn(label,action,cls){const b=el('button','action'+(cls?' '+cls:''),label);b.type='button';b.addEventListener('click',action);return b;}
function stop(){token++;playing=false;if(delay!==null){clearTimeout(delay);delay=null;}try{window.speechSynthesis?.cancel();}catch(e){}}
function total(d){return d.forms.length+d.examples.length;}
function item(d,i){return i<d.forms.length?d.forms[i][0]:d.examples[i-d.forms.length][0];}
function voiceFor(locale){try{const vv=window.speechSynthesis.getVoices();return vv.find(v=>v.lang?.toLowerCase()===locale.toLowerCase())||vv.find(v=>v.lang?.toLowerCase().startsWith(locale.slice(0,2).toLowerCase()))||null;}catch(e){return null;}}
function nextSpoken(t){if(t!==token||!playing)return;const d=current(),s=state();if(s.mode!=='lesson')return stop();
if(s.position>=total(d)){stop();render();return;}
render();
const langText=item(d,s.position);
if(!window.SpeechSynthesisUtterance||!window.speechSynthesis){stop();message='На этом устройстве озвучка недоступна.';render();return;}
try{
const utter=new SpeechSynthesisUtterance(langText);
utter.lang=d.locale;const voice=voiceFor(d.locale);if(voice)utter.voice=voice;
utter.rate=lang==='es'?0.74:0.78;utter.pitch=1;
utter.onend=()=>{if(t!==token||!playing)return;delay=setTimeout(()=>{delay=null;if(t!==token||!playing)return;s.position++;explanationOpen=false;persist();nextSpoken(t);},1500);};
utter.onerror=()=>{if(t!==token)return;stop();message='Голосовое воспроизведение остановилось. Попробуй снова.';render();};
window.speechSynthesis.speak(utter);
}catch(e){stop();message='Не удалось воспроизвести фразу.';render();}
}
function toggle(){if(playing){stop();render();return;}explanationOpen=false;const s=state(),d=current();if(s.position>=total(d))s.position=0;message='';persist();stop();playing=true;nextSpoken(token);}
function practice(){stop();explanationOpen=false;state().mode='practice';state().typed='';state().checked=false;message='';persist();render();}
function normalize(v){return String(v||'').normalize('NFC').trim().replace(/[’‘]/g,"'").replace(/\s+/g,' ').replace(/^[¿¡]/,'').replace(/[.!?]+$/,'').toLowerCase();}
function assess(v,expected){if(!String(v).trim())return {match:false,info:'Напиши весь перевод.'};if(normalize(v)===normalize(expected))return {match:true,info:'Написано правильно.'};
const a=normalize(v),b=normalize(expected);
if(a.normalize('NFD').replace(/[\u0300-\u036f]/g,'')===b.normalize('NFD').replace(/[\u0300-\u036f]/g,''))return {match:false,info:'Проверь ударение или букву ñ.'};
let p=0;const aa=[...a],bb=[...b];while(p<aa.length&&p<bb.length&&aa[p]===bb[p])p++;
return {match:false,info:'Ответ отличается от образца. Проверь написание примерно с символа '+(p+1)+'.'};
}
function check(){const s=state();const v=$('answer')?.value||s.typed;s.typed=v.slice(0,500);if(!s.typed.trim()){message='Напиши перевод, потом проверь.';render();return;}s.checked=true;message='';persist();render();}
function retry(){state().checked=false;persist();render();$('answer')?.focus();}
function nextTask(){const s=state(),d=current();if(!s.checked||s.task>=d.tasks.length)return;const expected=d.tasks[s.task][1],result=assess(s.typed,expected);s.results.push({value:s.typed,match:result.match});s.task++;s.typed='';s.checked=false;persist();render();$('answer')?.focus();}
function restart(){stop();explanationOpen=false;saved[lang]=fresh();persist();render();}
function header(stage,n,max){const meta=el('div','lesson-top');meta.append(el('span','',stage),el('span','',n+' / '+max));app.append(meta);const meter=el('div','meter'),bar=el('div');bar.style.width=Math.round(n/max*100)+'%';meter.append(bar);app.append(meter);}
function lessonScreen(d,s){const size=total(d),position=s.position;
header('Урок 1',Math.min(size,position+1),size);
app.append(el('h1','',d.verb));
const stage=el('div','stage');
if(position<d.forms.length){
stage.append(el('p','stage-kicker',lang==='es'?'Conjugación':'Conjugation'));
const rows=el('div','table');
d.forms.forEach((pair,i)=>{const row=el('div','table-row'+(i===position?' active':''));
const w=el('span','table-word',pair[0]);w.lang=lang;row.append(w);rows.append(row);});
stage.append(rows);
}else{
const idx=Math.min(position-d.forms.length,d.examples.length-1),pair=d.examples[idx];
stage.append(el('p','stage-kicker',lang==='es'?'Frases · '+(idx+1):'Sentences · '+(idx+1)));
const foreign=el('div','phrase',pair[0]);foreign.lang=lang;stage.append(foreign);
}
app.append(stage);
if(explanationOpen){const explanation=el('div','explanation');explanation.setAttribute('role','region');
 if(position<d.forms.length){
  explanation.append(el('strong','','Формы глагола'),el('p','',d.forms.map(p=>p[0]+' — '+p[1]).join('; ')+'.'));
  explanation.append(el('p','','После этой формы другой глагол остаётся в начальной форме. Например: '+(lang==='es'?'quiero aprender':'want to learn')+'.'));
 }else{
  const ex=d.examples[Math.min(position-d.forms.length,d.examples.length-1)];
  explanation.append(el('strong','','Перевод'),el('p','',ex[1]),el('p','',ex[2]));
 }
 app.append(explanation);
}
const actions=el('div','actions');
actions.append(btn(playing?'⏸ Пауза':position>=size?'▶ Повторить':'▶ Слушать',toggle,'primary'),btn(explanationOpen?'Скрыть пояснение':'? Пояснение',()=>{stop();explanationOpen=!explanationOpen;render();},''));
app.append(actions);
app.append(btn('Перейти к практике →',practice,'practice-link'));

}
function practiceScreen(d,s){const n=d.tasks.length;
if(s.task>=n){header('Результат',n,n);const match=s.results.filter(x=>x.match).length;
app.append(el('h1','','Письменная практика закончена'),el('div','score',match+' / '+n),el('p','rule','Столько ответов совпало с образцом. Другие правильные переводы пробная проверка пока не распознаёт.'));
const actions=el('div','actions');actions.append(btn('Повторить урок',restart,'primary'));app.append(actions);return;}
header('Пишем полные предложения',s.task+1,n);
const pair=d.tasks[s.task];const card=el('div','question-card');
card.append(el('div','stage-kicker','Переведи на '+d.name.toLowerCase()),el('div','question',pair[0]));
const label=el('label','', 'Твой ответ');label.htmlFor='answer';card.append(label);
const input=el('input','answer');input.id='answer';input.type='text';input.lang=lang;input.autocomplete='off';input.spellcheck=false;input.setAttribute('autocapitalize','none');input.value=s.typed;input.readOnly=s.checked;
input.addEventListener('input',()=>{s.typed=input.value.slice(0,500);persist();});
input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();s.checked?nextTask():check();}});
card.append(input);
if(s.checked){const r=assess(s.typed,pair[1]);const feedback=el('div','feedback'+(r.match?' good':''));feedback.append(el('strong','',r.match?'Совпадает с образцом':'Проверь по образцу'),el('div','',r.info),el('div','sample',pair[1]),el('div','',pair[2]));card.append(feedback);}
app.append(card);
const actions=el('div','actions');if(s.checked){actions.append(btn('Исправить',retry,''),btn('Следующее →',nextTask,'primary'));}else{actions.append(btn('Проверить',check,'primary'));}app.append(actions);
app.append(el('p','muted','В этой пробе проверяется точное написание. Несколько правильных вариантов перевода пока не поддерживаются.'));
}
function render(){const d=current(),s=state();for(const k of ['es','en'])$('tab-'+k).classList.toggle('selected',k===lang);app.replaceChildren();s.mode==='lesson'?lessonScreen(d,s):practiceScreen(d,s);const note=$('notice');note.textContent=message;}
for(const k of ['es','en'])$('tab-'+k).addEventListener('click',()=>{if(lang===k)return;stop();lang=k;explanationOpen=false;message='';persist();render();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing){stop();render();}});
window.addEventListener('pagehide',stop);
window.LinguaPreviewQA={assess,data:()=>DATA,state:()=>saved};
persist();render();
})();</script>
