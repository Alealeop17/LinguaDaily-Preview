let dialogueCall=null,dialogueAttempt=0,dialogueJoining=false,dialogueError='',dialogueStatus='';
let previewPasscode='',dialogueTranscript=[],dialogueMuted=false;
const TUTOR_PREF_KEY='lingua-daily-realtime-tutor-pref-v1';
let tutorPrefs={style:'calm',voice:'marin',pace:'slow'};
try{
 const savedPrefs=JSON.parse(localStorage.getItem(TUTOR_PREF_KEY)||'null');
 if(savedPrefs){
  if(['calm','energetic','demanding'].includes(savedPrefs.style))tutorPrefs.style=savedPrefs.style;
  if(['marin','cedar'].includes(savedPrefs.voice))tutorPrefs.voice=savedPrefs.voice;
  if(['slow','normal'].includes(savedPrefs.pace))tutorPrefs.pace=savedPrefs.pace;
 }
}catch(e){}
function saveTutorPrefs(){
 try{localStorage.setItem(TUTOR_PREF_KEY,JSON.stringify(tutorPrefs))}
 catch(e){elid('status').textContent='Не удалось сохранить настройки преподавателя.'}
}
function tutorChoice(card,labelText,id,key,options){
 const label=el('label','answer-label',labelText);label.htmlFor=id;card.append(label);
 const select=el('select','voice-picker');select.id=id;select.setAttribute('aria-label',labelText);
 for(const [value,title] of options){const option=el('option','',title);option.value=value;select.append(option)}
 select.value=tutorPrefs[key];
 select.addEventListener('change',()=>{
  tutorPrefs[key]=select.value;saveTutorPrefs();
 });
 card.append(select);
}
const MAX_PREVIEW_CALL_MS=10*60*1000;
let dialogueTimeout=null,pendingDialogueStream=null,dialogueSoundBlocked=false;
const remoteDialogueAudio=document.createElement('audio');
remoteDialogueAudio.autoplay=true;remoteDialogueAudio.playsInline=true;
remoteDialogueAudio.setAttribute('aria-hidden','true');
document.body.append(remoteDialogueAudio);
function cleanCall(c){
 if(!c)return;
 try{c.channel?.close()}catch(e){}
 try{c.pc?.close()}catch(e){}
 try{c.stream?.getTracks().forEach(track=>track.stop())}catch(e){}
 remoteDialogueAudio.srcObject=null;
}
function endDialogue(){
 ++dialogueAttempt;
 if(dialogueTimeout!==null){clearTimeout(dialogueTimeout);dialogueTimeout=null}
 const connectedStream=dialogueCall?.stream;
 cleanCall(dialogueCall);dialogueCall=null;
 if(pendingDialogueStream&&pendingDialogueStream!==connectedStream){
  try{pendingDialogueStream.getTracks().forEach(track=>track.stop())}catch(e){}
 }
 pendingDialogueStream=null;dialogueJoining=false;dialogueSoundBlocked=false;
 dialogueMuted=false;dialogueStatus='';dialogueError='';
}
function onDialogueEvent(e,attempt){
 if(attempt!==dialogueAttempt)return;
 let data;try{data=JSON.parse(e.data)}catch{return}
 if(data.type==='error'){dialogueError='Ошибка голосовой сессии. Заверши разговор и попробуй снова.';render();return}
 let text='',who='';
 if(data.type==='conversation.item.input_audio_transcription.completed'){text=data.transcript||'';who='Ты'}
 if(data.type==='response.output_audio_transcript.done'){text=data.transcript||'';who='Преподаватель'}
 if(text){dialogueTranscript.push({who,text:String(text).slice(0,600)});dialogueTranscript=dialogueTranscript.slice(-12);render()}
}
async function startDialogue(){
 if(dialogueJoining||dialogueCall)return;
 if(!previewPasscode.trim()){dialogueError='Введи код доступа к пробной версии.';render();return}
 if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia||!window.RTCPeerConnection){
  dialogueError='Для голосового разговора нужен HTTPS и браузер с WebRTC и доступом к микрофону.';render();return;
 }
 const attempt=++dialogueAttempt;dialogueJoining=true;dialogueError='';dialogueStatus='Подключаем преподавателя…';
 dialogueSoundBlocked=false;render();
 let pc=null,stream=null,channel=null;
 try{
  // Ask permission before requesting a 60-second token, which might expire while iOS waits for microphone approval.
  stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true},video:false});
  if(attempt!==dialogueAttempt){stream.getTracks().forEach(t=>t.stop());return}
  pendingDialogueStream=stream;
  const errors=[...new Set(state().queue.map(q=>q.task))].slice(0,6);
  const mastered=state().slots.filter(slot=>slot.status==='green').length;
  const tokenResponse=await fetch('/api/realtime/token',{
   method:'POST',headers:{'Content-Type':'application/json','X-Preview-Access':previewPasscode},
   body:JSON.stringify({lang,lesson:idx,errors,mastered,...tutorPrefs})
  });
  if(!tokenResponse.ok){
   const hints={401:'Неверный код доступа.',403:'Сайт не допущен к голосовому серверу.',429:'Лимит голосовых подключений исчерпан.',503:'Голосовой сервер ещё не настроен.'};
   throw Error(hints[tokenResponse.status]||'Не удалось получить доступ к голосовому серверу.');
  }
  const token=await tokenResponse.json();
  if(!token.value||typeof token.value!=='string')throw Error('Сервер не вернул временный ключ.');
  if(attempt!==dialogueAttempt)return;
  pc=new RTCPeerConnection();dialogueCall={pc,stream,channel:null};pendingDialogueStream=null;
  pc.ontrack=e=>{if(attempt===dialogueAttempt){remoteDialogueAudio.srcObject=e.streams[0];remoteDialogueAudio.play().then(()=>{dialogueSoundBlocked=false}).catch(()=>{dialogueSoundBlocked=true;dialogueStatus='Браузер заблокировал звук. Нажми «Включить звук преподавателя».';render()})}};
  pc.onconnectionstatechange=()=>{
   if(attempt!==dialogueAttempt)return;
   if(pc.connectionState==='failed'||pc.connectionState==='closed'){
    endDialogue();dialogueError='Голосовое соединение прервано.';render();
   }
  };
  for(const track of stream.getAudioTracks())pc.addTrack(track,stream);
  channel=pc.createDataChannel('oai-events');dialogueCall.channel=channel;
  channel.onmessage=e=>onDialogueEvent(e,attempt);
  channel.onopen=()=>{
   if(attempt!==dialogueAttempt)return;
   dialogueJoining=false;dialogueStatus='На связи. Преподаватель слушает тебя.';render();
   if(dialogueTimeout!==null)clearTimeout(dialogueTimeout);
   dialogueTimeout=setTimeout(()=>{
    if(attempt!==dialogueAttempt)return;
    endDialogue();dialogueStatus='Пробные десять минут закончились. Можно начать следующий разговор.';render();
   },MAX_PREVIEW_CALL_MS);
   dialogueTimeout?.unref?.();
   channel.send(JSON.stringify({type:'response.create',response:{}}));
  };
  const offer=await pc.createOffer();await pc.setLocalDescription(offer);
  const answer=await fetch('https://api.openai.com/v1/realtime/calls',{
   method:'POST',headers:{'Authorization':'Bearer '+token.value,'Content-Type':'application/sdp'},body:offer.sdp
  });
  if(!answer.ok)throw Error('OpenAI не принял голосовое подключение.');
  const sdp=await answer.text();
  if(attempt!==dialogueAttempt)return;
  await pc.setRemoteDescription({type:'answer',sdp});
 }catch(e){
  if(attempt!==dialogueAttempt){if(pendingDialogueStream===stream||dialogueCall?.stream===stream)cleanCall({pc,stream,channel});return}
  if(!dialogueCall){cleanCall({pc,stream,channel});pendingDialogueStream=null}
  endDialogue();dialogueError=e?.name==='NotAllowedError'?'Разреши доступ к микрофону для этого сайта.':(e?.message||'Не удалось подключиться.');
  render();
 }
}
function enableDialogueAudio(){
 remoteDialogueAudio.play().then(()=>{
  dialogueSoundBlocked=false;dialogueStatus='Звук преподавателя включён.';render()
 }).catch(()=>{dialogueSoundBlocked=true;dialogueError='Не удалось включить звук. Проверь режим звука и разрешения браузера.';render()});
}
function toggleDialogueMic(){
 if(!dialogueCall)return;
 dialogueMuted=!dialogueMuted;
 dialogueCall.stream.getAudioTracks().forEach(track=>track.enabled=!dialogueMuted);
 render();
}
function toggleOral(on){
 if(oralMode===on)return; // Tapping an already-selected tab must not hang up a call.
 endDialogue();cancelAudio();oralMode=on;quickRef=null;showPrompt=false;
 dialogueTranscript=[];render();
}
function renderDialogue(){
 sectionHeading('Свободный диалог · урок '+(idx+1),'OpenAI Realtime');
 root.append(el('h1','','Разговор с преподавателем'));
 root.append(el('p','lead','Общайся на '+(lang==='es'?'испанском':'английском')+', задавай вопросы и проси объяснить непонятное по-русски. Можно перебивать и переспрашивать.'));
 const card=el('div','panel');
 if(!dialogueCall&&!dialogueJoining){
  const label=el('label','answer-label','Код доступа к пробной версии');label.htmlFor='preview-code';card.append(label);
  const access=el('input','answer');access.id='preview-code';access.type='password';access.autocomplete='off';access.value=previewPasscode;
  access.addEventListener('input',()=>{previewPasscode=access.value.slice(0,180)});card.append(access);
  tutorChoice(card,'Стиль преподавателя','tutor-style','style',[
   ['calm','Спокойный'],['energetic','Энергичный'],['demanding','Требовательный']
  ]);
  tutorChoice(card,'Голос преподавателя','tutor-voice','voice',[
   ['marin','Marin'],['cedar','Cedar']
  ]);
  tutorChoice(card,'Скорость речи','tutor-pace','pace',[
   ['slow','Медленно'],['normal','Обычная']
  ]);
 }
 if(dialogueStatus)card.append(el('p','lead',dialogueStatus));
 if(dialogueError)card.append(el('p','retry',dialogueError));
 if(dialogueCall){
  if(dialogueSoundBlocked)card.append(button('Включить звук преподавателя',enableDialogueAudio,'primary'));
  card.append(button(dialogueMuted?'Включить микрофон':'Выключить микрофон',toggleDialogueMic));
  card.append(button('Завершить разговор',()=>{endDialogue();render()},'primary'));
 }else{
  const start=button(dialogueJoining?'Подключаем…':'Начать разговор',startDialogue,'primary');start.disabled=dialogueJoining;card.append(start);
  if(dialogueJoining)card.append(button('Отмена',()=>{endDialogue();render()}));
 }
 root.append(card);
 if(dialogueTranscript.length){
  const transcript=el('div','panel');transcript.append(el('strong','','Последние реплики'));
  for(const line of dialogueTranscript)transcript.append(el('p','note',line.who+': '+line.text));
  root.append(transcript);
 }
 root.append(el('p','note','Используется микрофон. Пробный разговор длится максимум 10 минут. OpenAI API оплачивается отдельно. Реплики не сохраняются в браузере после закрытия страницы.'));
}
elid('mode-write').addEventListener('click',()=>toggleOral(false));
elid('mode-speak').addEventListener('click',()=>toggleOral(true));

window.LinguaPreviewQA={curriculum,state:()=>saved,assess,ensureActive,check,next,count,setPhase,switchLesson,MAX,renderDialogue,showQuickReference};
persist();render();
