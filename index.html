<!doctype html>
<html lang="ru"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#F7F8F5">
<title>Lingua Daily — Перевод и письмо</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#233c2d;background:#f7f8f5;font-size:16px;color-scheme:light}
*{box-sizing:border-box}body{margin:0;min-width:280px}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}
.shell{max-width:570px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 18px calc(35px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;margin:0 0 23px}.brand{font-size:21px;font-weight:850;letter-spacing:-.6px}.brand em{color:#2b845c;font-style:normal}.caption{color:#77877c;font-size:12px}
.langs{display:flex;gap:5px;padding:4px;margin-bottom:25px;background:#e7eee6;border-radius:13px}.langs button{flex:1;border:0;border-radius:10px;padding:12px 8px;font-weight:740;font-size:14px;background:transparent;color:#65776a}.langs button.selected{background:#fff;color:#185d40;box-shadow:0 1px 7px #234c2914}
.topline{display:flex;justify-content:space-between;align-items:center;color:#697e6c;font-size:12px;font-weight:690;margin-bottom:9px}
.meter{height:5px;border-radius:100px;background:#e4ece4;overflow:hidden;margin-bottom:22px}.meter div{height:100%;background:#2f8460}
h1{font-weight:815;font-size:clamp(27px,7vw,37px);line-height:1.17;letter-spacing:-.75px;margin:0 0 12px}
.instruction{font-size:15px;line-height:1.5;color:#627366;margin:0 0 24px}
.card{background:#fff;border:1px solid #e3ebe3;border-radius:22px;padding:22px 19px;box-shadow:0 7px 25px #25513b0a}
.play{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:78px;background:#e7f4eb;border:1px solid #b9dac5;border-radius:17px;color:#125037;font-size:19px;font-weight:800;padding:15px}.play .sound{font-size:24px}.play:focus-visible{outline:3px solid #8bc3a2;outline-offset:2px}
.prompt-hint{font-size:13px;color:#6a7d70;text-align:center;line-height:1.5;margin:12px 0 0}
.prompt-reveal{text-align:center;margin:13px 0 0;color:#526f5b;font-weight:740;font-size:18px;line-height:1.4}
.input-label{display:block;font-size:14px;font-weight:740;color:#536e5d;margin:27px 0 9px}input.answer{border:1.5px solid #b9d0c1;width:100%;border-radius:13px;padding:16px 13px;min-height:57px;background:#fff;color:#213c2c;font-size:19px}input.answer:focus{outline:3px solid #d2edda;border-color:#55a077}input.answer:read-only{background:#f5f7f4}
.controls{display:flex;gap:10px;margin-top:17px}.btn{flex:1;min-height:50px;border:1px solid #c6d8ca;border-radius:13px;background:#fff;color:#245842;padding:12px 10px;font-size:15px;font-weight:760}.btn.primary{background:#1e6947;color:#fff;border-color:#1e6947}.btn:focus-visible{outline:3px solid #a6d3b6;outline-offset:2px}
.lightlink{display:block;border:0;background:transparent;color:#5e8069;padding:11px 7px;margin:9px auto 0;font-weight:700;font-size:13px}
.feedback{border-radius:14px;padding:15px;margin:17px 0 0;background:#fff1e1;color:#705336;font-size:14px;line-height:1.5}.feedback.good{background:#e7f4e9;color:#225b3a}.feedback strong{display:block;margin:0 0 7px;font-size:15px}.feedback .foreign{display:block;font-size:clamp(20px,6vw,27px);font-weight:830;color:#1d5e40;margin:9px 0;line-height:1.35}
.formref{padding:15px;border-radius:16px;background:#f0f6ef;margin-top:10px}.formref h2{font-size:16px;margin:0 0 10px}.formrows{display:grid;grid-template-columns:1fr 1fr;gap:7px}.formrow{border:1px solid #dbe8dc;background:#fff;color:#1a5537;border-radius:10px;min-height:46px;padding:9px 6px;font-size:14px;font-weight:735;line-height:1.3}
.rule{padding:11px 13px;border-radius:12px;background:#f1f6f1;color:#516857;line-height:1.5;font-size:13px;margin-top:12px}
.score{font-size:46px;font-weight:850;color:#236944;margin:14px 0}
.small-note{font-size:12px;line-height:1.45;color:#859188;margin:13px 1px 0}
@media(max-width:345px){.shell{padding-left:12px;padding-right:12px}.card{padding:17px 13px}.btn{font-size:13px}.play{font-size:16px}.formrow{font-size:13px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body><div class="shell"><header><div class="brand">Lingua <em>Daily</em></div><div class="caption">Практика речи и письма</div></header><nav class="langs" aria-label="Выбери язык"><button type="button" id="lang-es">Испанский</button><button type="button" id="lang-en">Английский</button></nav><main id="app"></main><div id="status" class="small-note" role="status"></div></div>
<script>'use strict';
const content={
es:{
 word:'Querer',locale:'es-ES',
 forms:[
 ['Yo quiero','Я хочу'],
 ['Tú quieres','Ты хочешь'],
 ['Él quiere','Он хочет'],
 ['Ella quiere','Она хочет'],
 ['Usted quiere','Вы хотите · вежливо'],
 ['Nosotros queremos','Мы хотим'],
 ['Nosotras queremos','Мы хотим'],
 ['Vosotros queréis','Вы хотите'],
 ['Vosotras queréis','Вы хотите'],
 ['Ellos quieren','Они хотят'],
 ['Ellas quieren','Они хотят'],
 ['Ustedes quieren','Вы хотите · вежливо']
 ],
 examples:[
 ['Quiero aprender español.','Я хочу учить испанский.','Quiero + aprender: второй глагол не изменяется.'],
 ['Tú quieres trabajar mañana.','Ты хочешь работать завтра.','Tú quieres: с tú окончание меняется.'],
 ['Él quiere visitar Madrid.','Он хочет посетить Мадрид.','Él quiere: он хочет.'],
 ['Ella quiere comprar un libro.','Она хочет купить книгу.','Ella quiere: она хочет.'],
 ['Usted quiere hablar conmigo.','Вы хотите поговорить со мной.','Usted — уважительное обращение к одному человеку; глагол quiere.'],
 ['Nosotros queremos estudiar aquí.','Мы хотим заниматься здесь.','Nosotros queremos: форма для мы.'],
 ['Nosotras queremos viajar a España.','Мы хотим поехать в Испанию (женская группа).','Nosotras — мы, когда речь только о женщинах.'],
 ['Vosotros queréis aprender español.','Вы хотите учить испанский (неформально, Испания).','Vosotros queréis: форма для нескольких людей в Испании.'],
 ['Vosotras queréis trabajar aquí.','Вы хотите работать здесь (женская группа, Испания).','Vosotras — обращение к группе женщин.'],
 ['Ellos quieren vivir en Valencia.','Они хотят жить в Валенсии.','Ellos quieren — они хотят.'],
 ['Ellas quieren hablar español.','Они хотят говорить по-испански (женщины).','Ellas quieren — женская группа.'],
 ['Ustedes quieren visitar este lugar.','Вы хотите посетить это место (несколько человек).','Ustedes требует форму quieren.'],
 ['No quiero trabajar hoy.','Я не хочу работать сегодня.','No перед quiero образует отрицание.'],
 ['¿Quieres estudiar conmigo?','Ты хочешь позаниматься со мной?','Вопрос: quieres; conmigo — со мной.']
 ],
 tasks:[
 ['Я хочу учить испанский.','Yo quiero aprender español.','Форма первого лица — quiero.'],
 ['Ты хочешь работать завтра.','Tú quieres trabajar mañana.','Тú quieres — форма для ты.'],
 ['Он хочет посетить Мадрид.','Él quiere visitar Madrid.','Él пишется с ударением.'],
 ['Она хочет купить книгу.','Ella quiere comprar un libro.','Ella quiere — она хочет.'],
 ['Вы хотите поговорить со мной.','Usted quiere hablar conmigo.','Usted употребляется с quiere.','вежливо'],
 ['Мы хотим учиться здесь.','Nosotros queremos estudiar aquí.','Nosotros queremos — мы хотим.','', ['Nosotras queremos estudiar aquí.']],
 ['Мы хотим поехать в Испанию.','Nosotras queremos viajar a España.','Nosotras — мы хотим.','', ['Nosotros queremos viajar a España.']],
 ['Вы хотите учить испанский.','Vosotros queréis aprender español.','Проверь ударение в queréis.','неформально', ['Vosotras queréis aprender español.']],
 ['Вы хотите работать здесь.','Vosotras queréis trabajar aquí.','Vosotras queréis.','неформально', ['Vosotros queréis trabajar aquí.']],
 ['Они хотят жить в Валенсии.','Ellos quieren vivir en Valencia.','Ellos quieren.','', ['Ellas quieren vivir en Valencia.']],
 ['Они хотят говорить по-испански.','Ellas quieren hablar español.','Ellas quieren.','', ['Ellos quieren hablar español.']],
 ['Вы хотите посетить это место.','Ustedes quieren visitar este lugar.','Ustedes — обращение к группе.','вежливо'],
 ['Я не хочу работать сегодня.','No quiero trabajar hoy.','No перед quiero.'],
 ['Ты хочешь позаниматься со мной?','¿Quieres estudiar conmigo?','Вопросительные знаки: ¿ и ?.']
 ],
 notes:[
 'Глагол querer означает «хотеть». У него меняется гласная в основе: quiero, quieres, quiere, quieren. В формах nosotros и vosotros — queremos, queréis.',
 'Usted — уважительное «Вы» одному человеку, с глаголом quiere. Ustedes — обращение к нескольким: с глаголом quieren.',
 'Vosotros / vosotras — неформальное «вы» в Испании. В большинстве стран Латинской Америки вместо него используют ustedes.',
 'В испанском местоимение нередко опускают. В этих письменных упражнениях мы используем его, чтобы отработать каждое лицо.'
 ]
},
en:{
 word:'Want',locale:'en-GB',
 forms:[
 ['I want','Я хочу'],['You want','Ты хочешь'],['He wants','Он хочет'],['She wants','Она хочет'],
 ['It wants','Оно хочет'],['We want','Мы хотим'],['You want','Вы хотите'],['They want','Они хотят']
 ],
 examples:[
 ['I want to learn English.','Я хочу учить английский.','I want to + глагол.'],
 ['You want to work tomorrow.','Ты хочешь работать завтра.','You want — ты хочешь.'],
 ['He wants to visit Madrid.','Он хочет посетить Мадрид.','He wants: добавляем s.'],
 ['She wants to buy a book.','Она хочет купить книгу.','She wants.'],
 ['It wants to sleep.','Оно хочет спать.','It wants.'],
 ['We want to study here.','Мы хотим заниматься здесь.','We want.'],
 ['You want to learn English.','Вы хотите учить английский.','You — ты и вы.'],
 ['They want to live in Valencia.','Они хотят жить в Валенсии.','They want.'],
 ["I don't want to work today.",'Я не хочу работать сегодня.','I don’t want to — отрицание.'],
 ['Do you want to study with me?','Ты хочешь позаниматься со мной?','Вопрос: Do you want to…?']
 ],
 tasks:[
 ['Я хочу учить английский.','I want to learn English.','I want to learn.'],
 ['Ты хочешь работать завтра.','You want to work tomorrow.','You want.'],
 ['Он хочет посетить Мадрид.','He wants to visit Madrid.','He wants.'],
 ['Она хочет купить книгу.','She wants to buy a book.','She wants.'],
 ['Оно хочет спать.','It wants to sleep.','It wants.'],
 ['Мы хотим заниматься здесь.','We want to study here.','We want.'],
 ['Вы хотите учить английский.','You want to learn English.','You want.'],
 ['Они хотят жить в Валенсии.','They want to live in Valencia.','They want.'],
 ['Я не хочу работать сегодня.',"I don't want to work today.",'Don’t want.'],
 ['Ты хочешь позаниматься со мной?','Do you want to study with me?','Do you want to…?']
 ],
 notes:[
 'После want перед глаголом используется to: I want to work.',
 'В настоящем времени с he, she, it глагол получает окончание -s: wants.',
 'You означает и «ты», и «вы». Форма want в этих случаях совпадает.',
 'В отрицаниях и вопросах используются do / does.'
 ]
}
};

const STORE='lingua-daily-iphone-preview-v7';
content.es.tasks.unshift(['Я хочу учиться.','Quiero aprender.','Quiero + infinitivo.']);
content.en.tasks.unshift(['Я хочу учиться.','I want to learn.','I want to + verb.']);
const fresh=()=>({i:0,draft:'',checked:false,results:[]});
const valid=(s,l)=>!!s&&typeof s==='object'&&!Array.isArray(s)&&Number.isInteger(s.i)&&s.i>=0&&s.i<=content[l].tasks.length&&typeof s.draft==='string'&&s.draft.length<=500&&typeof s.checked==='boolean'&&Array.isArray(s.results)&&s.results.length===s.i&&s.results.every(r=>r&&typeof r.answer==='string'&&typeof r.ok==='boolean');
let saved=null;
try{const t=JSON.parse(localStorage.getItem(STORE)||'null');if(t&&['es','en'].includes(t.lang)&&valid(t.es,'es')&&valid(t.en,'en'))saved=t;}catch(e){}
if(!saved)saved={lang:'es',es:fresh(),en:fresh()};
let lang=saved.lang,showPrompt=false,showForms=false,showRule=false,audioText='',audioLocale='';
const root=document.getElementById('app');
const $=id=>document.getElementById(id);
const data=()=>content[lang],state=()=>saved[lang];
const store=()=>{saved.lang=lang;try{localStorage.setItem(STORE,JSON.stringify(saved))}catch(e){}};
function make(tag,cls,txt){let x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=txt;return x}
function button(text,fn,cls=''){const x=make('button','btn '+cls,text);x.type='button';x.addEventListener('click',fn);return x}
function cutAudio(){try{window.speechSynthesis?.cancel()}catch(e){}}
function voiceFor(locale){try{const vs=window.speechSynthesis.getVoices();return vs.find(v=>v.lang?.toLowerCase()===locale.toLowerCase())||vs.find(v=>v.lang?.toLowerCase().startsWith(locale.slice(0,2)))||null}catch(e){return null}}
function speak(txt,locale,rate){cutAudio();if(!window.speechSynthesis||!window.SpeechSynthesisUtterance){$('status').textContent='На этом устройстве нет доступной озвучки.';return}
 try{const u=new SpeechSynthesisUtterance(txt);u.lang=locale;u.rate=rate;const v=voiceFor(locale);if(v)u.voice=v;window.speechSynthesis.speak(u);audioText=txt;audioLocale=locale;}catch(e){$('status').textContent='Не удалось воспроизвести фразу.'}}
function russianPrompt(){const task=data().tasks[state().i];if(!task)return;
 const phrase=task[0]+(task[3]?' '+task[3].charAt(0).toUpperCase()+task[3].slice(1)+'.':'');
 speak(phrase,'ru-RU',0.68);}
function normal(v){return String(v||'').normalize('NFC').trim().replace(/[’‘]/g,"'").replace(/\s+/g,' ').replace(/[.!?¡¿]+$/g,'').toLowerCase();}
function assess(value,model,l,alternatives=[]){const a=normal(value),b=normal(model);
 if(!a)return {ok:false,why:'Напиши перевод полностью.'};
 if(l==='en'&&model.startsWith('I ')&&!value.trim().startsWith('I '))return {ok:false,why:'Местоимение I нужно писать с заглавной буквы.'};
 if(l==='en'&&model.includes('English')&&!value.includes('English'))return {ok:false,why:'Название языка English пишется с заглавной буквы.'};
 const models=[model,...(Array.isArray(alternatives)?alternatives:[])];
 const subj=/^(yo|tú|él|ella|usted|nosotros|nosotras|vosotros|vosotras|ellos|ellas|ustedes) /i;
 if(models.some(x=>normal(x)===a||(l==='es'&&normal(x.replace(subj,''))===a)))
   return {ok:true,why:'Написано правильно.'};
 if(a.normalize('NFD').replace(/[\u0300-\u036f]/g,'')===b.normalize('NFD').replace(/[\u0300-\u036f]/g,''))return {ok:false,why:'Проверь ударение или букву ñ.'};
 let i=0,aa=[...a],bb=[...b];while(i<aa.length&&i<bb.length&&aa[i]===bb[i])i++;
 return {ok:false,why:'Ответ отличается от образца. Проверь написание примерно с символа '+(i+1)+'.'};
}
function check(){const s=state(),task=data().tasks[s.i],inp=$('answer');if(inp)s.draft=inp.value.slice(0,500);if(!s.draft.trim()){$('status').textContent='Напиши перевод в поле ответа.';return}
 s.checked=true;store();render();speak(assess(s.draft,task[1],lang,task[4]).ok?s.draft:task[1],data().locale,lang==='es'?0.64:0.68);}
function rewrite(){state().checked=false;store();render();$('answer')?.focus()}
function next(){const s=state(),d=data();if(!s.checked)return;const r=assess(s.draft,d.tasks[s.i][1],lang,d.tasks[s.i][4]);s.results.push({answer:s.draft,ok:r.ok});s.i++;s.draft='';s.checked=false;showRule=false;showPrompt=false;cutAudio();store();render();}
function restart(){cutAudio();saved[lang]=fresh();showForms=false;showRule=false;showPrompt=false;store();render()}
function formHelp(){showForms=!showForms;cutAudio();render()}
function progress(count,max){const top=make('div','topline');top.append(make('span','','Перевод с русского'),make('span','',Math.min(count+1,max)+' / '+max));root.append(top);
 const meter=make('div','meter'),bar=make('div');bar.style.width=(Math.min(count,max)/max*100)+'%';meter.append(bar);root.append(meter);}
function render(){
 for(const k of ['es','en'])$('lang-'+k).classList.toggle('selected',lang===k);
 root.replaceChildren();$('status').textContent='';const d=data(),s=state(),tasks=d.tasks;
 if(s.i===tasks.length){progress(tasks.length,tasks.length);root.append(make('h1','','Тренировка завершена'));
 const correct=s.results.filter(x=>x.ok).length;root.append(make('div','score',correct+' / '+tasks.length),make('p','instruction','Столько ответов совпало с образцом. Можно снова пройти тренировку.'));
 root.append(button('Пройти ещё раз',restart,'primary'));return;}
 progress(s.i,tasks.length);
 root.append(make('h1','','Переведи на '+(lang==='es'?'испанский':'английский')));
 root.append(make('p','instruction','Послушай русскую фразу, скажи перевод вслух и напиши его самостоятельно.'));
 const card=make('div','card');
 const play=make('button','play');play.type='button';play.append(make('span','sound','◖))'),make('span','','Слушать задание на русском'));
 play.addEventListener('click',russianPrompt);card.append(play);
 card.append(make('p','prompt-hint','Нажми, чтобы услышать фразу. Можно слушать повторно.'));
 if(showPrompt)card.append(make('p','prompt-reveal',tasks[s.i][0]+(tasks[s.i][3]?' — '+tasks[s.i][3]:'')));
 const view=button(showPrompt?'Скрыть текст задания':'Показать текст задания',()=>{showPrompt=!showPrompt;render()},'lightlink');
 view.className='lightlink';card.append(view);
 const lbl=make('label','input-label','Твой перевод');lbl.htmlFor='answer';card.append(lbl);
 const input=make('input','answer');input.id='answer';input.type='text';input.lang=lang;input.autocomplete='off';input.spellcheck=false;input.setAttribute('autocapitalize','none');input.value=s.draft;input.readOnly=s.checked;
 input.addEventListener('input',()=>{s.draft=input.value.slice(0,500);store()});
 input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();s.checked?next():check()}});
 card.append(input);
 if(s.checked){const ans=tasks[s.i][1],r=assess(s.draft,ans,lang,tasks[s.i][4]);const note=make('div','feedback'+(r.ok?' good':''));note.append(make('strong','',r.ok?'Правильно!':'Сравни с правильным вариантом'),make('p','',r.why),make('div','foreign',ans));note.querySelector?.('.foreign')?.setAttribute('lang',lang);
 const playAns=button('▶ Слушать правильный ответ',()=>speak(ans,d.locale,lang==='es'?0.64:0.68));playAns.className='lightlink';note.append(playAns);
 const small=button(showRule?'Скрыть объяснение':'Почему так?',()=>{showRule=!showRule;render()});small.className='lightlink';note.append(small);
 if(showRule)note.append(make('div','rule',tasks[s.i][2]));card.append(note);}
 root.append(card);
 const acts=make('div','controls');
 if(s.checked){acts.append(button('Исправить',rewrite),button('Следующее →',next,'primary'))}else acts.append(button('Проверить',check,'primary'));
 root.append(acts);
 const ref=button(showForms?'Скрыть формы':'? Формы глагола',formHelp);ref.className='lightlink';root.append(ref);
 if(showForms){const box=make('div','formref');box.append(make('h2','',d.word+' — все формы'));const rows=make('div','formrows');
  d.forms.forEach(([foreign,ru])=>{const f=make('button','formrow',foreign);f.type='button';f.lang=lang;f.setAttribute('title',ru);f.addEventListener('click',()=>speak(foreign,d.locale,lang==='es'?0.64:0.68));rows.append(f);});
  box.append(rows,make('p','small-note','Нажми на любую форму, чтобы услышать произношение. Перевод доступен в подсказке к кнопке.'));root.append(box);}
 root.append(make('p','small-note','Проверяем написание. Допустимые варианты рода в испанском тоже засчитываются.'));
}
for(const k of ['es','en'])$('lang-'+k).addEventListener('click',()=>{if(lang===k)return;cutAudio();lang=k;showForms=false;showPrompt=false;showRule=false;store();render();});
document.addEventListener('visibilitychange',()=>{if(document.hidden)cutAudio()});window.addEventListener('pagehide',cutAudio);
window.LinguaPreviewQA={content,assess,state:()=>saved};
store();render();
</script>
</body></html>
