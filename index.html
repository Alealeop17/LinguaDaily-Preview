 ['Vosotras queréis trabajar aquí.','Вы хотите работать здесь (женская группа, Испания).','Vosotras — обращение к группе женщин.'],

 ],

 ['Я хочу учить испанский.','Yo quiero aprender español.','Форма первого лица — quiero.'],
 ['Ты хочешь работать завтра.','Tú quieres trabajar mañana.','Тú quieres — форма для ты.'],
 ['Он хочет посетить Мадрид.','Él quiere visitar Madrid.','Él пишется с ударением.'],
 ['Она хочет купить книгу.','Ella quiere comprar un libro.','Ella quiere — она хочет.'],
 ['Вы (вежливо, одному человеку) хотите поговорить со мной.','Usted quiere hablar conmigo.','Usted употребляется с quiere.'],
 ['Мы (мужчины или смешанная группа) хотим учиться здесь.','Nosotros queremos estudiar aquí.','Nosotros queremos — мы хотим.'],
 ['Мы (женщины) хотим поехать в Испанию.','Nosotras queremos viajar a España.','Nosotras — группа женщин.'],
 ['Вы (группа мужчин или смешанная группа, неформально в Испании) хотите учить испанский.','Vosotros queréis aprender español.','Проверь ударение в queréis.'],
 ['Вы (группа женщин, неформально в Испании) хотите работать здесь.','Vosotras queréis trabajar aquí.','Vosotras queréis.'],
 ['Они (мужчины или смешанная группа) хотят жить в Валенсии.','Ellos quieren vivir en Valencia.','Ellos quieren.'],
 ['Они (женщины) хотят говорить по-испански.','Ellas quieren hablar español.','Ellas quieren.'],
 ['Вы (несколько человек, вежливо) хотите посетить это место.','Ustedes quieren visitar este lugar.','Ustedes хотят — ustedes quieren.'],

 ],
 notes:[
 'Глагол querer означает «хотеть». У него меняется гласная в основе: quiero, quieres, quiere, quieren. В формах nosotros и vosotros — queremos, queréis.',
 'Usted — уважительное «Вы» одному человеку, с глаголом quiere. Ustedes — обращение к нескольким: с глаголом quieren.',
 'Vosotros / vosotras — неформальное «вы» в Испании. В большинстве стран Латинской Америки вместо него используют ustedes.',
 'В испанском местоимение нередко опускают. В этих письменных упражнениях мы используем его, чтобы отработать каждое лицо.'
 ]
},
en:{
 word:'Want',locale:'en-GB',
 forms:[
 ['I want','Я хочу'],['You want','Ты хочешь'],['He wants','Он хочет'],['She wants','Она хочет'],
 ['It wants','Оно хочет'],['We want','Мы хотим'],['You want','Вы хотите'],['They want','Они хотят']
 ],
 examples:[
 ['I want to learn English.','Я хочу учить английский.','I want to + глагол.'],
 ['You want to work tomorrow.','Ты хочешь работать завтра.','You want — ты хочешь.'],
 ['He wants to visit Madrid.','Он хочет посетить Мадрид.','He wants: добавляем s.'],
 ['She wants to buy a book.','Она хочет купить книгу.','She wants.'],
 ['It wants to sleep.','Оно хочет спать.','It wants.'],
 ['We want to study here.','Мы хотим заниматься здесь.','We want.'],
 ['You want to learn English.','Вы хотите учить английский.','You — ты и вы.'],
 ['They want to live in Valencia.','Они хотят жить в Валенсии.','They want.'],
 ["I don't want to work today.",'Я не хочу работать сегодня.','I don’t want to — отрицание.'],
 ['Do you want to study with me?','Ты хочешь позаниматься со мной?','Вопрос: Do you want to…?']
 ],
 tasks:[
 ['Я хочу учить английский.','I want to learn English.','I want to learn.'],
 ['Ты хочешь работать завтра.','You want to work tomorrow.','You want.'],
 ['Он хочет посетить Мадрид.','He wants to visit Madrid.','He wants.'],
 ['Она хочет купить книгу.','She wants to buy a book.','She wants.'],
 ['Оно хочет спать.','It wants to sleep.','It wants.'],
 ['Мы хотим заниматься здесь.','We want to study here.','We want.'],
 ['Вы хотите учить английский.','You want to learn English.','You want.'],
 ['Они хотят жить в Валенсии.','They want to live in Valencia.','They want.'],
 ['Я не хочу работать сегодня.',"I don't want to work today.",'Don’t want.'],
 ['Ты хочешь позаниматься со мной?','Do you want to study with me?','Do you want to…?']
 ],
 notes:[
 'После want перед глаголом используется to: I want to work.',
 'В настоящем времени с he, she, it глагол получает окончание -s: wants.',
 'You означает и «ты», и «вы». Форма want в этих случаях совпадает.',

 ]
}
};
const STORE='lingua-daily-iphone-preview-v5';
const fresh=()=>({phase:'forms',form:0,example:0,task:0,input:'',checked:false,results:[]});
function valid(s,l){
 const d=content[l];
 return s&&typeof s==='object'&&!Array.isArray(s)&&['forms','examples','write','result'].includes(s.phase)&&
 Number.isInteger(s.form)&&s.form>=0&&s.form<=d.forms.length&&Number.isInteger(s.example)&&s.example>=0&&s.example<=d.examples.length&&
 Number.isInteger(s.task)&&s.task>=0&&s.task<=d.tasks.length&&typeof s.input==='string'&&s.input.length<=500&&
 typeof s.checked==='boolean'&&Array.isArray(s.results)&&s.results.length===s.task&&
 s.results.every(x=>x&&typeof x.value==='string'&&x.value.length<=500&&typeof x.ok==='boolean');
}
let saved=null;try{const s=JSON.parse(localStorage.getItem(STORE)||'null');if(s&&['es','en'].includes(s.language)&&valid(s.es,'es')&&valid(s.en,'en'))saved=s;}catch(e){}
if(!saved)saved={language:'es',es:fresh(),en:fresh()};
let lang=saved.language,playing=false,token=0,timer=null,explanation=false,slower=false,errorText='';
const app=document.getElementById('app');
const qs=id=>document.getElementById(id);
const state=()=>saved[lang],lesson=()=>content[lang];
function store(){saved.language=lang;try{localStorage.setItem(STORE,JSON.stringify(saved));}catch(e){errorText='В этом браузере не удалось сохранить прогресс.'}}
function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n;}
function btn(label,onClick,cls){const b=el('button','btn '+(cls||''),label);b.type='button';b.addEventListener('click',onClick);return b;}
function stop(){token++;playing=false;if(timer!==null){clearTimeout(timer);timer=null;}try{window.speechSynthesis?.cancel()}catch(e){}}
function voiceFor(locale){try{const v=window.speechSynthesis.getVoices();return v.find(x=>x.lang?.toLowerCase()===locale.toLowerCase())||v.find(x=>x.lang?.toLowerCase().startsWith(locale.slice(0,2).toLowerCase()))||null;}catch(e){return null}}
function speak(text,onDone){
 if(!window.speechSynthesis||!window.SpeechSynthesisUtterance){stop();errorText='На этом устройстве не работает озвучка.';render();return;}
 const t=token;
 try{
  const u=new SpeechSynthesisUtterance(text);u.lang=lesson().locale;
  const v=voiceFor(u.lang);if(v)u.voice=v;
  u.rate=slower?.50:.62;u.pitch=1;
  u.onend=()=>{if(t===token&&playing)onDone()};
  u.onerror=()=>{if(t!==token)return;stop();errorText='Озвучка прервалась. Нажми «Слушать» ещё раз.';render()};
  window.speechSynthesis.speak(u);
 }catch(e){stop();errorText='Не удалось включить звук.';render()}
}
function playSequence(){
 if(!playing)return;
 const d=lesson(),s=state(),phase=s.phase,t=token;
 const arr=phase==='forms'?d.forms:d.examples;
 const idx=phase==='forms'?s.form:s.example;
 if(idx>=arr.length){stop();render();return;}
 render();
 speak(arr[idx][0],()=>{
  timer=setTimeout(()=>{
   timer=null;if(!playing||t!==token)return;
   if(phase==='forms')s.form++;else s.example++;
   store();playSequence();
  },phase==='forms'?2800:4800);
 });
}
function togglePlay(){
 if(playing){stop();render();return;}
 const d=lesson(),s=state(),arr=s.phase==='forms'?d.forms:d.examples;
 if(!['forms','examples'].includes(s.phase))return;
 if(s.phase==='forms'&&s.form>=arr.length)s.form=0;
 if(s.phase==='examples'&&s.example>=arr.length)s.example=0;
 stop();playing=true;explanation=false;errorText='';store();playSequence();
}
function onePhrase(text){
 stop();errorText='';
 if(!window.speechSynthesis||!window.SpeechSynthesisUtterance){errorText='На этом устройстве не работает озвучка.';render();return}
 const u=new SpeechSynthesisUtterance(text);
 u.lang=lesson().locale;const v=voiceFor(u.lang);if(v)u.voice=v;u.rate=slower?.50:.62;
 try{window.speechSynthesis.speak(u)}catch(e){errorText='Не удалось включить звук.'}
}
function setPhase(phase){stop();explanation=false;errorText='';state().phase=phase;store();render();}
function normal(v){return String(v||'').normalize('NFC').trim().replace(/[’‘]/g,"'").replace(/\s+/g,' ').replace(/[.!?¡¿]+$/g,'').toLocaleLowerCase('en');}
function assess(answer,expected){const a=normal(answer),b=normal(expected);
 if(!a)return {ok:false,why:'Напиши весь ответ.'};
 if(lesson().locale==='en-GB'&&expected.includes('English')&&!String(answer).includes('English'))return {ok:false,why:'English пишется с заглавной буквы.'};
 if(lesson().locale==='en-GB'&&expected.startsWith('I ')&&!String(answer).trim().startsWith('I '))return {ok:false,why:'Местоимение I пишется с заглавной буквы.'};
 if(a===b)return {ok:true,why:'Написано правильно.'};
 if(a.normalize('NFD').replace(/[\u0300-\u036f]/g,'')===b.normalize('NFD').replace(/[\u0300-\u036f]/g,''))return {ok:false,why:'Проверь ударения или букву ñ.'};
 const aa=[...a],bb=[...b];let i=0;while(i<aa.length&&i<bb.length&&aa[i]===bb[i])i++;
 return {ok:false,why:'Отличается от образца. Проверь написание начиная примерно с символа '+(i+1)+'.'}
}
function check(){const s=state();const inp=qs('answer');if(inp)s.input=inp.value.slice(0,500);if(!s.input.trim()){errorText='Сначала напиши перевод.';render();return;}s.checked=true;store();render()}
function retry(){const s=state();s.checked=false;store();render();qs('answer')?.focus()}
function next(){const s=state(),d=lesson();if(!s.checked||s.task>=d.tasks.length)return;
 s.results.push({value:s.input,ok:assess(s.input,d.tasks[s.task][1]).ok});s.task++;s.input='';s.checked=false;
 if(s.task>=d.tasks.length)s.phase='result';store();render();qs('answer')?.focus()
}
function reset(){stop();explanation=false;saved[lang]=fresh();store();render()}
function header(title,pos,total){const m=el('div','meta');m.append(el('span','',title),el('span','',pos+' / '+total));app.append(m);
 const pr=el('div','progress'),bar=el('div');bar.style.width=Math.round((pos/Math.max(1,total))*100)+'%';pr.append(bar);app.append(pr)}
function explanationBlock(lines){const b=el('div','explain');b.setAttribute('role','region');for(const text of lines)b.append(el('p','',text));app.append(b)}
function formScreen(){
 const d=lesson(),s=state();header('1. Формы глагола',Math.min(d.forms.length,s.form+1),d.forms.length);
 app.append(el('h1','',d.word),el('div','taskhint','Послушай каждую форму и повтори вслух во время паузы.'));
 const p=el('div','panel'),grid=el('div','form-grid');
 d.forms.forEach((pair,i)=>{
  const row=el('button','form'+(s.form===i?' active':''),pair[0]);row.type='button';row.lang=lang;
  row.setAttribute('aria-label',pair[0]+'. Нажми, чтобы послушать ещё раз');
  row.addEventListener('click',()=>{s.form=i;store();render();onePhrase(pair[0])});
  grid.append(row);
 });p.append(grid);app.append(p);
 app.append(el('p','caption','Нажми на любую форму, чтобы услышать её отдельно.'));
 if(explanation)explanationBlock(d.notes);
 const actions=el('div','actions');actions.append(btn(playing?'⏸ Пауза':'▶ Слушать формы',togglePlay,'primary'),btn(slower?'Обычная скорость':'Ещё медленнее',()=>{slower=!slower;if(playing)stop();render()},''));app.append(actions);
 app.append(btn(explanation?'Скрыть пояснение':'? Пояснение',()=>{explanation=!explanation;stop();render()},'text-link'));
 app.append(btn('Перейти к примерам →',()=>setPhase('examples'),'text-link'));
}
function exampleScreen(){
 const d=lesson(),s=state(),n=d.examples.length,pos=s.example;header('2. Читаем и повторяем',Math.min(n,pos+1),n);
 app.append(el('h2','','Сначала произнеси фразу сама. Затем послушай и повтори.'));
 const p=el('div','panel');if(pos<n){
  const phrase=el('div','phrase',d.examples[pos][0]);phrase.lang=lang;p.append(phrase);
 }else p.append(el('div','phrase','✓'));
 app.append(p);
 app.append(el('p','caption',pos>=n?'Примеры закончились. Можно переходить к письменной практике.':'После фразы будет пауза четыре–пять секунд, чтобы ты успела повторить.'));
 if(explanation&&pos<n)explanationBlock([d.examples[pos][1],d.examples[pos][2]]);
 const actions=el('div','actions');actions.append(btn(playing?'⏸ Пауза':pos>=n?'▶ Прослушать снова':'▶ Слушать и повторять',togglePlay,'primary'),
 btn(slower?'Обычная скорость':'Ещё медленнее',()=>{slower=!slower;if(playing)stop();render()},''));app.append(actions);
 app.append(btn(explanation?'Скрыть перевод':'? Перевод',()=>{explanation=!explanation;stop();render()},'text-link'));
 app.append(btn('Перейти к письму →',()=>setPhase('write'),'text-link'));
 app.append(btn('← Формы глагола',()=>setPhase('forms'),'text-link'));
}
function writeScreen(){
 const d=lesson(),s=state(),n=d.tasks.length;
 header('3. Переводи и пиши',s.task+1,n);
 const p=el('div','panel'),task=d.tasks[s.task];p.append(el('p','caption','Напиши перевод на изучаемом языке, полностью и без вариантов ответа.'),el('div','question',task[0]));
 const label=el('label','caption','Твой перевод');label.htmlFor='answer';p.append(label);
 const inp=el('input','answer');inp.id='answer';inp.type='text';inp.autocomplete='off';inp.spellcheck=false;inp.setAttribute('autocapitalize','none');inp.lang=lang;inp.value=s.input;inp.readOnly=s.checked;
 inp.addEventListener('input',()=>{s.input=inp.value.slice(0,500);store()});
 inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();s.checked?next():check()}});
 p.append(inp);
 if(s.checked){const r=assess(s.input,task[1]);const fb=el('div','feedback'+(r.ok?' good':''));fb.append(el('strong','',r.ok?'Верно':'Проверь ответ'),el('div','',r.why),el('div','expected',task[1]),el('div','',task[2]));p.append(fb)}
 app.append(p);
 const actions=el('div','actions');if(s.checked)actions.append(btn('Переписать',retry,''),btn('Следующее →',next,'primary'));else actions.append(btn('Проверить',check,'primary'));app.append(actions);
 app.append(el('p','footer','Проверка пока сравнивает написание с образцом. Другие правильные переводы могут не распознаваться.'));
 app.append(btn('← Вернуться к примерам',()=>setPhase('examples'),'text-link'))
}
function resultScreen(){
 const d=lesson(),s=state(),good=s.results.filter(x=>x.ok).length;
 header('Тренировка завершена',d.tasks.length,d.tasks.length);
 app.append(el('h2','','Результат письменной практики'),el('div','score',good+' / '+d.tasks.length),
 el('p','caption','Столько переводов совпало с образцом. Можно ещё раз повторить формы и пройти упражнения.'));
 const a=el('div','actions');a.append(btn('Повторить урок',reset,'primary'));app.append(a)
}
function render(){
 for(const k of ['es','en'])qs('tab-'+k).classList.toggle('selected',lang===k);
 app.replaceChildren();const phase=state().phase;
 if(phase==='forms')formScreen();else if(phase==='examples')exampleScreen();else if(phase==='write')writeScreen();else resultScreen();
 qs('notice').textContent=errorText;
}
for(const k of ['es','en'])qs('tab-'+k).addEventListener('click',()=>{if(lang===k)return;stop();lang=k;explanation=false;errorText='';store();render()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing){stop();render()}});
window.addEventListener('pagehide',stop);
window.LinguaPreviewQA={content,assess,progress:()=>saved};
store();render();
})();</script>
</body></html>
