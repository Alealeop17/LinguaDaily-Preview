function valid(s,l,n){
 const count=packs[l][n].tasks.length;
 if(!s||typeof s!=='object'||!['cards','practice'].includes(s.phase)||!Array.isArray(s.slots)||s.slots.length>MAX||!Array.isArray(s.queue)||!Array.isArray(s.mistakes))return false;
 if(!Number.isInteger(s.cursor)||s.cursor<0||!Number.isInteger(s.turns)||s.turns<0||!Number.isInteger(s.errors)||s.errors<0||typeof s.draft!=='string'||s.draft.length>500||typeof s.checked!=='boolean')return false;
 if(!s.slots.every(x=>x&&Number.isInteger(x.task)&&x.task>=0&&x.task<count&&['green','red'].includes(x.status)))return false;
 if(!s.queue.every(q=>q&&Number.isInteger(q.slot)&&q.slot>=0&&q.slot<s.slots.length&&q.task===s.slots[q.slot].task&&s.slots[q.slot].status==='red'&&Number.isInteger(q.due)))return false;

}

function speak(text,language,rate){stop();if(!window.speechSynthesis||!window.SpeechSynthesisUtterance){$('status').textContent='На этом устройстве озвучка недоступна.';return}
 try{const u=new SpeechSynthesisUtterance(text);u.lang=language;u.rate=rate;const v=voice(language);if(v)u.voice=v;window.speechSynthesis.speak(u)}catch(e){$('status').textContent='Не удалось воспроизвести фразу.'}}
function versions(model,l){
 if(l!=='es')return [model];
 const arr=[model], pairs=[['nosotros','nosotras'],['vosotros','vosotras'],['ellos','ellas']];
 for(const [a,b] of pairs){const re1=new RegExp('\\b'+a+'\\b','gi'),re2=new RegExp('\\b'+b+'\\b','gi');
 if(re1.test(model))arr.push(model.replace(re1,m=>m[0]===m[0].toUpperCase()?b[0].toUpperCase()+b.slice(1):b));
 if(re2.test(model))arr.push(model.replace(re2,m=>m[0]===m[0].toUpperCase()?a[0].toUpperCase()+a.slice(1):a));}
 return arr;
}
function assess(value,model,l){
 const a=norm(value),b=norm(model);if(!a)return {ok:false,why:'Напиши ответ целиком.'};
 if(l==='en'&&model.includes('English')&&!String(value).includes('English'))return {ok:false,why:'Название English пишется с большой буквы.'};
 if(l==='en'&&model.startsWith('I ')&&!String(value).trim().startsWith('I '))return {ok:false,why:'Местоимение I пишется с большой буквы.'};
 const grammarVariants=versions(model,l);
 if(grammarVariants.some(v=>norm(v)===a||(l==='es'&&norm(v.replace(/^(yo|tú|él|ella|usted|nosotros|nosotras|vosotros|vosotras|ellos|ellas|ustedes) /i,''))===a)))return {ok:true,why:'Написано правильно.'};
 if(a.normalize('NFD').replace(/[\u0300-\u036f]/g,'')===b.normalize('NFD').replace(/[\u0300-\u036f]/g,''))return {ok:false,why:'Проверь ударения и букву ñ.'};
 let i=0,aa=[...a],bb=[...b];while(i<aa.length&&i<bb.length&&aa[i]===bb[i])i++;

}
function ensureActive(){
 const s=state();if(s.phase!=='practice'||s.active)return;
 if(s.slots.length===MAX&&!s.queue.length)return;
 const due=s.queue.filter(q=>q.due<=s.turns).sort((a,b)=>a.due-b.due)[0];
 const forced=s.slots.length>=MAX?[...s.queue].sort((a,b)=>a.due-b.due)[0]:null;
 const q=due||forced;
 if(q)s.active={task:q.task,slot:q.slot,review:true};
 else if(s.slots.length<MAX){s.active={task:s.cursor%data().tasks.length,slot:-1,review:false};s.cursor++;}
 else throw Error('Retry state inconsistent');

}
function current(){ensureActive();return state().active?data().tasks[state().active.task]:null}
function sayQuestion(){const t=current();if(!t)return;speak(t[0]+(t[3]?' '+t[3][0].toUpperCase()+t[3].slice(1)+'.':''),'ru-RU',0.68)}

function check(){
 const s=state(),t=current();if(!t||s.checked)return;
 const inp=$('answer');if(inp)s.draft=inp.value.slice(0,500);
 if(!s.draft.trim()){$('status').textContent='Напиши перевод, затем проверь.';return}
 const r=assess(s.draft,t[1],lang);
 s.turns++;const act=s.active;let slot=act.slot;

 else {if(!s.slots[slot]||s.slots[slot].task!==act.task)throw Error('Review state mismatch');s.slots[slot].status=r.ok?'green':'red'}

}
function next(){const s=state();if(!s.checked)return;stop();s.draft='';s.checked=false;s.last=null;s.active=null;showPrompt=false;showRule=false;store();render()}

 card.addEventListener('click',()=>speak(foreign.replace(/\//g,', '),locale(),lang==='es'?0.7:0.72));grid.append(card)});

function renderCards(){

function progress(s){
 const count=green(s),red=s.slots.length-count;const meta=make('div','topline');meta.append(make('span','','До автоматизма · Урок '+(lessonIndex+1)),make('span','',count+' / '+MAX));root.append(meta);
