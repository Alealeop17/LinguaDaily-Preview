 ['Ты хочешь работать завтра.','Tú quieres trabajar mañana.','Тú quieres — форма для ты.'],
 ['Он хочет посетить Мадрид.','Él quiere visitar Madrid.','Él пишется с ударением.'],

 ['Вы хотите поговорить со мной.','Usted quiere hablar conmigo.','Usted употребляется с quiere.','вежливо'],

 ['Вы хотите работать здесь.','Vosotras queréis trabajar aquí.','Vosotras queréis.','неформально', ['Vosotros queréis trabajar aquí.']],
 ['Они хотят жить в Валенсии.','Ellos quieren vivir en Valencia.','Ellos quieren.','', ['Ellas quieren vivir en Valencia.']],

const STORE='lingua-daily-iphone-preview-v8';
const PREVIOUS='lingua-daily-iphone-preview-v7';
const MAX=100;
content.es.tasks.unshift(['Я хочу учиться.','Quiero aprender.','Quiero + инфинитив.']);
content.en.tasks.unshift(['Я хочу учиться.','I want to learn.','I want to + verb.']);
const fresh=()=>({slots:[],queue:[],cursor:0,turns:0,errors:0,mistakes:[],active:null,draft:'',checked:false,last:null});
const valid=(s,l)=>{
 const len=content[l].tasks.length;
 if(!s||typeof s!=='object'||!Array.isArray(s.slots)||s.slots.length>MAX||!Array.isArray(s.queue)||!Array.isArray(s.mistakes))return false;
 if(!Number.isInteger(s.cursor)||s.cursor<0||!Number.isInteger(s.turns)||s.turns<0||!Number.isInteger(s.errors)||s.errors<0||typeof s.draft!=='string'||s.draft.length>500||typeof s.checked!=='boolean')return false;
 if(!s.slots.every(x=>x&&Number.isInteger(x.task)&&x.task>=0&&x.task<len&&['green','red'].includes(x.status)))return false;
 if(!s.queue.every(q=>q&&Number.isInteger(q.slot)&&q.slot>=0&&q.slot<s.slots.length&&q.task===s.slots[q.slot].task&&s.slots[q.slot].status==='red'&&Number.isInteger(q.due)))return false;
 if(s.active!==null&&(!s.active||!Number.isInteger(s.active.task)||s.active.task<0||s.active.task>=len||typeof s.active.review!=='boolean'||(!s.active.review&&s.slots.length>=MAX)||s.active.review&&(!Number.isInteger(s.active.slot)||s.active.slot<0||s.active.slot>=s.slots.length)))return false;
 if(s.checked&&(!s.active||!s.last||typeof s.last.ok!=='boolean'))return false;
 return true;
};
function migrateOne(old,l){
 const out=fresh(),answers=Array.isArray(old?.results)?old.results:[];
 answers.slice(0,content[l].tasks.length).forEach((r,i)=>{
  const ok=!!r.ok;out.slots.push({task:i,status:ok?'green':'red'});
  if(!ok){out.errors++;out.mistakes[i]=(out.mistakes[i]||0)+1;out.queue.push({slot:i,task:i,due:answers.length+1});}
 });
 out.turns=answers.length;out.cursor=answers.length;
 if(typeof old?.draft==='string')out.draft=old.draft.slice(0,500);
 return out;
}
let saved=null;
try{const t=JSON.parse(localStorage.getItem(STORE)||'null');if(t&&['es','en'].includes(t.lang)&&valid(t.es,'es')&&valid(t.en,'en'))saved=t;}catch(e){}
if(!saved){try{const old=JSON.parse(localStorage.getItem(PREVIOUS)||'null');if(old&&old.es&&old.en&&['es','en'].includes(old.lang))saved={lang:old.lang,es:migrateOne(old.es,'es'),en:migrateOne(old.en,'en')};}catch(e){}}
if(!saved)saved={lang:'es',es:fresh(),en:fresh()};
let lang=saved.lang,showPrompt=false,showForms=false,showRule=false;
const root=document.getElementById('app'),$=id=>document.getElementById(id);
const data=()=>content[lang],state=()=>saved[lang];
function store(){saved.lang=lang;try{localStorage.setItem(STORE,JSON.stringify(saved))}catch(e){$('status').textContent='Прогресс не удалось сохранить. Проверь настройки Safari.'}}
function make(tag,cls,txt){const x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=txt;return x;}
function button(txt,fn,cls=''){const x=make('button','btn '+cls,txt);x.type='button';x.addEventListener('click',fn);return x;}
function cutAudio(){try{window.speechSynthesis?.cancel()}catch(e){}}
function voiceFor(locale){try{const v=window.speechSynthesis.getVoices();return v.find(x=>x.lang?.toLowerCase()===locale.toLowerCase())||v.find(x=>x.lang?.toLowerCase().startsWith(locale.slice(0,2)))||null}catch(e){return null}}
function speak(text,locale,rate){cutAudio();if(!window.speechSynthesis||!window.SpeechSynthesisUtterance){$('status').textContent='На этом устройстве озвучка недоступна.';return}
 try{const u=new SpeechSynthesisUtterance(text);u.lang=locale;u.rate=rate;const v=voiceFor(locale);if(v)u.voice=v;window.speechSynthesis.speak(u);}catch(e){$('status').textContent='Не удалось воспроизвести фразу.'}}
function normal(v){return String(v||'').normalize('NFC').trim().replace(/[’‘]/g,"'").replace(/\s+/g,' ').replace(/[.!?¡¿]+$/g,'').toLowerCase();}
function assess(value,model,l,alternatives=[]){
 const a=normal(value),b=normal(model);
 if(!a)return {ok:false,why:'Напиши перевод полностью.'};
 if(l==='en'&&model.startsWith('I ')&&!value.trim().startsWith('I '))return {ok:false,why:'Местоимение I нужно писать с заглавной буквы.'};
 if(l==='en'&&model.includes('English')&&!value.includes('English'))return {ok:false,why:'Название языка English пишется с заглавной буквы.'};
 const models=[model,...(Array.isArray(alternatives)?alternatives:[])];
 const subj=/^(yo|tú|él|ella|usted|nosotros|nosotras|vosotros|vosotras|ellos|ellas|ustedes) /i;
 if(models.some(x=>normal(x)===a||(l==='es'&&normal(x.replace(subj,''))===a)))return {ok:true,why:'Правильно.'};
 if(a.normalize('NFD').replace(/[\u0300-\u036f]/g,'')===b.normalize('NFD').replace(/[\u0300-\u036f]/g,''))return {ok:false,why:'Проверь ударения или букву ñ.'};
 let i=0,aa=[...a],bb=[...b];while(i<aa.length&&i<bb.length&&aa[i]===bb[i])i++;
 return {ok:false,why:'Проверь написание примерно с символа '+(i+1)+'.'};
}
function ensureActive(){
 const s=state();if(s.active)return;
 if(s.slots.length===MAX&&!s.queue.length)return;
 const due=s.queue.filter(q=>q.due<=s.turns).sort((a,b)=>a.due-b.due)[0];
 const forced=s.slots.length>=MAX ? [...s.queue].sort((a,b)=>a.due-b.due)[0] : null;
 const retry=due||forced;
 if(retry)s.active={task:retry.task,slot:retry.slot,review:true};
 else if(s.slots.length<MAX){s.active={task:s.cursor%data().tasks.length,slot:-1,review:false};s.cursor++;}
 else throw Error('Unresolved exercise progress');
 store();
}
function currentTask(){ensureActive();const s=state();return s.active?data().tasks[s.active.task]:null;}
function russianPrompt(){const task=currentTask();if(!task)return;const phrase=task[0]+(task[3]?' '+task[3][0].toUpperCase()+task[3].slice(1)+'.':'');speak(phrase,'ru-RU',0.68);}
function countGreen(s){return s.slots.filter(x=>x.status==='green').length}
function check(){
 const s=state(),task=currentTask();if(s.checked||!task)return;
 const inp=$('answer');if(inp)s.draft=inp.value.slice(0,500);
 if(!s.draft.trim()){$('status').textContent='Напиши перевод в поле ответа.';return;}
 const r=assess(s.draft,task[1],lang,task[4]);
 s.turns++;
 const act=s.active;let slot=act.slot;
 if(!act.review){slot=s.slots.length;s.slots.push({task:act.task,status:r.ok?'green':'red'});}
 else {if(!s.slots[slot]||s.slots[slot].task!==act.task)throw Error('Retry slot mismatch');s.slots[slot].status=r.ok?'green':'red';}
 if(r.ok){s.queue=s.queue.filter(q=>q.slot!==slot);}
 else{
  s.errors++;s.mistakes[act.task]=(s.mistakes[act.task]||0)+1;
  const old=s.queue.find(q=>q.slot===slot);
  if(old)old.due=s.turns+3;
  else s.queue.push({slot,task:act.task,due:s.turns+3});
 }
 s.last={ok:r.ok,wasReview:act.review,slot};s.checked=true;
 store();render();
 speak(r.ok?s.draft:task[1],data().locale,lang==='es'?0.64:0.68);
}
function next(){
 const s=state();if(!s.checked)return;
 cutAudio();s.draft='';s.checked=false;s.last=null;s.active=null;
 showRule=false;showPrompt=false;store();ensureActive();render();
}
function reset(){cutAudio();saved[lang]=fresh();showForms=false;showRule=false;showPrompt=false;store();ensureActive();render();}
function progress(s){
 const green=countGreen(s),red=s.slots.length-green;
 const meta=make('div','topline');meta.append(make('span','','До автоматизма'),make('span','',green+' / '+MAX));root.append(meta);
 const grid=make('div','mastery');grid.setAttribute('role','progressbar');grid.setAttribute('aria-label','Выучено ответов');grid.setAttribute('aria-valuemin','0');grid.setAttribute('aria-valuemax',String(MAX));grid.setAttribute('aria-valuenow',String(green));
 for(let i=0;i<MAX;i++){const item=make('span',s.slots[i]?.status||'empty');grid.append(item);}
 root.append(grid);
 const note=make('div','mastery-stat');note.append(make('span','','Зелёных: '+green),make('span','','Красных: '+red+' · Ошибок: '+s.errors));root.append(note);
}
function render(){
 for(const k of ['es','en'])$('lang-'+k).classList.toggle('selected',lang===k);
 root.replaceChildren();$('status').textContent='';
 const s=state(),d=data();ensureActive();progress(s);
 if(s.slots.length===MAX&&countGreen(s)===MAX){
  root.append(make('h1','','Все сто зелёные!'),make('p','instruction','Ты справилась с тренировкой. Все ошибочные предложения были повторены и исправлены.'));
  root.append(button('Начать новую тренировку',reset,'primary'));return;
 }
 const task=currentTask(),act=s.active;
 root.append(make('h1','','Переведи на '+(lang==='es'?'испанский':'английский')));
 root.append(make('p','instruction',act.review?'Повтор ошибки. Вспомни предложение и напиши его правильно.':'Слушай русскую фразу, скажи перевод и напиши его полностью.'));
 const card=make('div','card'),play=make('button','play');
 play.type='button';play.append(make('span','sound','◖))'),make('span','','Слушать задание на русском'));
 play.addEventListener('click',russianPrompt);card.append(play);
 card.append(make('p','prompt-hint','Нажми, чтобы услышать фразу ещё раз.'));
 if(showPrompt)card.append(make('p','prompt-reveal',task[0]+(task[3]?' — '+task[3]:'')));
 const show=button(showPrompt?'Скрыть текст задания':'Показать текст задания',()=>{showPrompt=!showPrompt;render()},'lightlink');show.className='lightlink';card.append(show);
 const label=make('label','input-label','Твой перевод');label.htmlFor='answer';card.append(label);
 const input=make('input','answer');input.id='answer';input.type='text';input.lang=lang;input.autocomplete='off';input.spellcheck=false;input.setAttribute('autocapitalize','none');input.value=s.draft;input.readOnly=s.checked;
 input.addEventListener('input',()=>{s.draft=input.value.slice(0,500);store()});
 input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();s.checked?next():check()}});
 card.append(input);
 if(s.checked){
  const r=assess(s.draft,task[1],lang,task[4]),note=make('div','feedback'+(r.ok?' good':''));
  note.append(make('strong','',r.ok?'Правильно! Полоска стала зелёной.':'Ошибка записана. Полоска красная.'),make('p','',r.why),make('div','foreign',task[1]));
  if(!r.ok)note.append(make('p','retry-note','Это предложение вернётся через несколько заданий.'));
  const answerButton=button('▶ Слушать правильный вариант',()=>speak(task[1],d.locale,lang==='es'?0.64:0.68));answerButton.className='lightlink';note.append(answerButton);
  const ruleButton=button(showRule?'Скрыть объяснение':'Почему так?',()=>{showRule=!showRule;render()});ruleButton.className='lightlink';note.append(ruleButton);
  if(showRule)note.append(make('div','rule',task[2]));
  card.append(note);
 }
 root.append(card);
 const controls=make('div','controls');if(s.checked)controls.append(button('Следующее предложение →',next,'primary'));else controls.append(button('Проверить',check,'primary'));
 root.append(controls);
 const help=button(showForms?'Скрыть формы':'? Формы глагола',()=>{showForms=!showForms;cutAudio();render()},'lightlink');help.className='lightlink';root.append(help);
 if(showForms){
  const box=make('div','formref');box.append(make('h2','',d.word+' — все формы'));
  const rows=make('div','formrows');d.forms.forEach(([foreign,ru])=>{const el=make('button','formrow',foreign);el.type='button';el.lang=lang;el.setAttribute('title',ru);el.addEventListener('click',()=>speak(foreign,d.locale,lang==='es'?0.64:0.68));rows.append(el);});
  box.append(rows);root.append(box);
 }
 root.append(make('p','small-note','Опечатки тоже считаются ошибками. Проблемные фразы будут повторяться, пока все сто полосок не станут зелёными.'));
}
for(const k of ['es','en'])$('lang-'+k).addEventListener('click',()=>{if(lang===k)return;cutAudio();lang=k;showPrompt=false;showForms=false;showRule=false;store();ensureActive();render();});
document.addEventListener('visibilitychange',()=>{if(document.hidden)cutAudio()});window.addEventListener('pagehide',cutAudio);
window.LinguaPreviewQA={content,assess,state:()=>saved,ensureActive,check,next,countGreen,reset,MAX};
ensureActive();store();render();
</script></body></html>
