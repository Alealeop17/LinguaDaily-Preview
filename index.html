function valid(s,l){const t=lessons[l];return s&&typeof s==='object'&&!Array.isArray(s)&&Number.isInteger(s.scene)&&s.scene>=0&&s.scene<=t.scenes.length&&Number.isInteger(s.task)&&s.task>=0&&s.task<=t.tasks.length&&typeof s.input==='string'&&s.input.length<=500&&typeof s.checked==='boolean'&&Array.isArray(s.results)&&s.results.length===s.task&&s.results.every((r,i)=>r&&r.id===t.tasks[i][0]&&typeof r.correct==='boolean'&&typeof r.value==='string');}

function node(tag,cl,text){const x=document.createElement(tag);if(cl)x.className=cl;if(text!==undefined)x.textContent=text;return x;}

function clean(v){return String(v||'').normalize('NFC').trim().replace(/[’‘]/g,"'").replace(/\s+/g,' ').replace(/^[¿¡]/,'').replace(/[.!?]+$/,'').toLowerCase();}
function assess(v,expected){if(!v.trim())return {ok:false,message:'Напиши предложение полностью.'};
if(expected.includes('English')&&!v.includes('English'))return {ok:false,message:'English пишется с большой буквы.'};
if(expected.startsWith('I ')&&!v.trim().startsWith('I '))return {ok:false,message:'Местоимение I всегда с большой буквы.'};
if(clean(v)===clean(expected))return {ok:true,message:'Правильно, все буквы на месте.'};
if(clean(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'')===clean(expected).normalize('NFD').replace(/[\u0300-\u036f]/g,''))return {ok:false,message:'Проверь ударения и букву ñ.'};
let a=Array.from(clean(v)),b=Array.from(clean(expected)),i=0;while(i<Math.min(a.length,b.length)&&a[i]===b[i])i++;
return {ok:false,message:'Проверь написание примерно с символа '+(i+1)+'.'};}
function progress(stage,total,label){const m=node('div','meta');m.append(node('span','',label),node('span','',stage+' / '+total));app.append(m);
const bar=node('div','progress'),fill=node('div');fill.style.width=Math.round(100*stage/Math.max(1,total))+'%';bar.append(fill);app.append(bar);}
function showExample(pair){const box=document.getElementById('example');if(!box)return;box.classList.remove('change');void box.offsetWidth;box.classList.add('change');
box.replaceChildren(node('div','hint','Пример целого предложения'),node('div','foreign',pair[0]),node('div','translation',pair[1]));box.querySelector('.foreign').lang=lang;}
function utterance(text,locale,token,done){if(!talking||token!==audioToken)return;
if(!window.speechSynthesis||!window.SpeechSynthesisUtterance){talking=false;status.textContent='Озвучка недоступна. Можно читать объяснение и сразу перейти к практике.';render();return;}
try{const u=new SpeechSynthesisUtterance(text);u.lang=locale;u.rate=locale==='ru-RU'?0.94:(locale==='es-ES'?0.82:0.87);
u.onend=()=>{if(talking&&token===audioToken)done();};u.onerror=()=>{if(token===audioToken){clearAudio();status.textContent='Озвучка остановилась. Можно нажать «Продолжить урок» или перейти к практике.';render();}};speechSynthesis.speak(u);}
catch(e){clearAudio();status.textContent='Озвучка недоступна. Прочитай объяснение и перейди к практике.';render();}}
function runScene(token){if(token!==audioToken||!talking)return;const st=s(),l=lesson();if(st.scene>=l.scenes.length){talking=false;render();return;}
const scene=l.scenes[st.scene];render();showExample(scene.examples[0]);
utterance(scene.narration,'ru-RU',token,()=>{let i=0;
const nextExample=()=>{if(token!==audioToken||!talking)return;if(i>=scene.examples.length){st.scene++;save();if(st.scene>=l.scenes.length){talking=false;render();}else runScene(token);return;}
const ex=scene.examples[i++];showExample(ex);utterance(ex[0],l.locale,token,nextExample);};
nextExample();});}
function start(){clearAudio();talking=true;const token=audioToken;status.textContent='Урок идёт непрерывно. Примеры меняются сами.';runScene(token);}
function gotoPractice(){clearAudio();s().scene=lesson().scenes.length;save();render();}
function check(){const st=s(),task=lesson().tasks[st.task],inp=document.getElementById('answer');if(inp)st.input=inp.value.slice(0,500);
if(!st.input.trim()){status.textContent='Напиши перевод, затем нажми «Проверить».';return;}st.checked=true;save();render();}
function nextTask(){const st=s(),task=lesson().tasks[st.task];if(!task||!st.checked)return;const res=assess(st.input,task[2]);st.results.push({id:task[0],value:st.input,correct:res.ok});st.task++;st.input='';st.checked=false;save();render();document.getElementById('answer')?.focus();}
function retry(){s().checked=false;save();render();document.getElementById('answer')?.focus();}
function render(){const l=lesson(),st=s();document.getElementById('course-title').textContent=l.title;
document.getElementById('tab-es').classList.toggle('active',lang==='es');document.getElementById('tab-en').classList.toggle('active',lang==='en');
app.replaceChildren();
if(st.scene<l.scenes.length){const scene=l.scenes[st.scene];progress(st.scene+1,l.scenes.length,'Объяснение · '+l.short);
app.append(node('p','eyebrow','Преподаватель рассказывает'),node('h2','lesson-title',scene.title),node('p','explain',scene.narration));
const box=node('div','example');box.id='example';app.append(box);showExample(scene.examples[0]);
const actions=node('div','controls');actions.append(button(talking?'⏸ Пауза':'▶ '+(st.scene?'Продолжить урок':'Слушать урок'),()=>{if(talking){clearAudio();render();}else start();},'primary'),button('К практике',gotoPractice));app.append(actions);
app.append(node('p','note','Объяснение и несколько примеров звучат подряд. Следующие части включаются автоматически — нажимать «Далее» не нужно.'));
}else if(st.task<l.tasks.length){const task=l.tasks[st.task];progress(st.task+1,l.tasks.length,'Письменная практика · '+l.short);
app.append(node('p','eyebrow','Переведи предложение полностью'),node('div','question',task[1]));
const label=node('label','label','Твой перевод');label.htmlFor='answer';app.append(label);
const inp=node('input','answer');inp.type='text';inp.id='answer';inp.lang=lang;inp.autocomplete='off';inp.setAttribute('autocapitalize','none');inp.spellcheck=false;inp.value=st.input;inp.readOnly=st.checked;inp.addEventListener('input',()=>{st.input=inp.value.slice(0,500);save();});
inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(st.checked)nextTask();else check();}});app.append(inp);
if(st.checked){const res=assess(st.input,task[2]);const msg=node('div','feedback'+(res.ok?' good':''));msg.append(node('strong','',res.ok?'Верно!':'Проверь написание'),node('div','',res.message),node('div','sample',task[2]),node('div','',task[3]));app.append(msg);
const actions=node('div','controls');actions.append(button('Исправить',retry),button('Следующее предложение →',nextTask,'primary'));app.append(actions);
}else{const actions=node('div','controls');actions.append(button('Проверить',check,'primary'));app.append(actions);}
app.append(node('p','note','Напиши ответ без подсказок. Пока проверяется точное написание по образцу; другие правильные варианты перевода могут быть не распознаны.'));
}else{const total=l.tasks.length,good=st.results.filter(x=>x.correct).length;app.append(node('p','eyebrow','Письменная практика завершена'),node('h2','lesson-title','Твой результат'),node('div','result',good+' / '+total),node('p','explain','Сложные предложения можно пройти ещё раз. Ответы в этой пробе сохраняются отдельно от основного приложения.'));
const actions=node('div','controls');actions.append(button('Посмотреть объяснение',()=>{st.scene=0;save();render();}),button('Пройти заново',()=>{clearAudio();data[lang]=fresh();save();render();},'primary'));app.append(actions);}
}
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{if(lang===b.dataset.lang)return;clearAudio();lang=b.dataset.lang;save();render();}));
document.addEventListener('visibilitychange',()=>{if(document.hidden&&talking){clearAudio();render();}});
window.addEventListener('pagehide',clearAudio);
window.LinguaPreviewQA=Object.freeze({assess,lesson:function(k){return lessons[k]},state:function(){return JSON.parse(JSON.stringify(data));}});
save();render();
})();
</script>
</body>
</html>
